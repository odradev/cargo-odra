[package]
authors = [
    "Jakub Płaskonka kuba@odra.dev",
    "Krzysztof Pobiarżyn krzysztof@odra.dev",
    "Maciej Zieliński maciej@odra.dev",
]
license = "MIT"
repository = "https://github.com/odradev/cargo-odra"
description = "A cargo utility that helps to create, manage and test your smart contracts written using Odra framework."
keywords = ["wasm", "webassembly", "blockchain"]
categories = ["wasm", "development-tools::cargo-plugins"]
name = "cargo-odra"
version = "0.2.1"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive", "cargo", "env"] }
convert_case = "0.12"
toml = "1"
serde = "1.0"
serde_derive = "1.0"
cargo-generate = "0.24"
rm_rf = "0.6.2"
glob = "0.3.4"
cargo_toml = "1"
prettycli = "0.1"
chrono = "0.4.45"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
regex = "1"
clap_complete_command = "0.6"
serde_json = "1"
semver = "1"
casper-types = { version = "6.1", features = ["std-fs-io"] }
dotenvy = "0.15"
# The account manager wasm and its checks. A git dependency until the Odra release that contains
# it (odradev/odra#724) is on crates.io; then `version = "2.11"`.
odra-casper-account-manager = { git = "https://github.com/odradev/odra", branch = "feature/account-manager", version = "2.10.0" }

[[bin]]
name = "cargo-odra"
path = "bin/main.rs"
