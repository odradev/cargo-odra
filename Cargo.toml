[package]
authors = [
    "Jakub Płaskonka kuba@odra.dev",
    "Krzysztof Pobiarżyn krzysztof@odra.dev",
    "Maciej Zieliński maciej@odra.dev",
]
license = "MIT"
repository = "https://github.com/odradev/cargo-odra"
description = "A cargo utility that helps to create, manage and test your smart contracts written using Odra framework."
keywords = ["wasm", "webassembly", "blockchain"]
categories = ["wasm", "development-tools::cargo-plugins"]
name = "cargo-odra"
version = "0.1.8"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive", "cargo"] }
convert_case = "0.12"
toml = "1"
serde = "1.0"
serde_derive = "1.0"
cargo-generate = "0.24"
rm_rf = "0.6.2"
glob = "0.3.4"
cargo_toml = "1"
prettycli = "0.1"
chrono = "0.4.45"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
regex = "1"
clap_complete_command = "0.6"
serde_json = "1"
semver = "1"

[[bin]]
name = "cargo-odra"
path = "bin/main.rs"
